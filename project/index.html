                            HTTP {apiResponse.status} {apiResponse.statusText}
                          </span>
                          <span className="text-xs text-slate-500 dark:text-slate-400 font-mono">Latency: {apiResponse.responseTime}</span>
                        </div>
                      </div>

                      <div className="bg-slate-900 text-slate-100 p-4 rounded-xl font-mono text-xs overflow-x-auto max-h-[400px] border border-slate-800 shadow-inner">
                        <div className="text-[10px] text-slate-500 mb-2 border-b border-slate-800 pb-1">RESPONSE HEADERS & BODY:</div>
                        <pre>{JSON.stringify(apiResponse, null, 2)}</pre>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* ======================================================== */}
            {/* TAB 4: STANDARDIZED EHR NOTE OUTPUT & EXPORTS             */}
            {/* ======================================================== */}
            {activeTab === "ehrNote" && (
              <div className="space-y-6">
                <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-6">
                  
                  {/* ACTION TOOLBAR */}
                  <div className="no-print flex flex-wrap items-center justify-between gap-3 pb-4 border-b border-slate-100 dark:border-slate-700">
                    <div>
                      <h2 className="text-base font-bold text-slate-900 dark:text-white flex items-center gap-2">
                        <Icon name="fileText" className="w-5 h-5 text-brand-600 dark:text-brand-400" />
                        Formatted EHR ADIME Clinical Note
                      </h2>
                      <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                        Standardized document compliant with hospital EHR charting standards.
                      </p>
                    </div>

                    <div className="flex items-center gap-2 flex-wrap">
                      <button
                        onClick={handleCopyNote}
                        className="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-semibold transition flex items-center gap-1.5"
                      >
                        <Icon name="copy" className="w-4 h-4" />
                        Copy Note
                      </button>
                      <button
                        onClick={handleDownloadMarkdown}
                        className="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-semibold transition flex items-center gap-1.5"
                      >
                        <Icon name="download" className="w-4 h-4" />
                        Download Markdown
                      </button>
                      <button
                        onClick={() => window.print()}
                        className="px-3.5 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow"
                      >
                        <Icon name="printer" className="w-4 h-4" />
                        Print / Save PDF
                      </button>
                    </div>
                  </div>

                  {/* CLINICAL EHR NOTE DOCUMENT LAYOUT */}
                  <div className="p-8 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-inner font-sans space-y-6">
                    {/* DOCUMENT HEADER */}
                    <div className="border-b-2 border-slate-300 dark:border-slate-700 pb-4 flex justify-between items-start">
                      <div>
                        <h1 className="text-xl font-extrabold text-slate-900 dark:text-white tracking-tight">CLINICAL NUTRITION ASSESSMENT & CARE PLAN</h1>
                        <p className="text-xs text-slate-500 dark:text-slate-400 uppercase tracking-widest font-semibold mt-0.5">eNCPT Standardized ADIME Note</p>
                      </div>
                      <div className="text-right text-xs text-slate-500 dark:text-slate-400 font-mono">
                        <div>Date: {new Date().toLocaleDateString()}</div>
                        <div>Status: Finalized</div>
                      </div>
                    </div>

                    {/* PATIENT INFO BANNER */}
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 text-xs">
                      <div>
                        <span className="text-slate-400 uppercase font-semibold block text-[10px]">Patient Name</span>
                        <span className="font-bold text-slate-800 dark:text-slate-200 text-sm">{chartData.patient.name}</span>
                      </div>
                      <div>
                        <span className="text-slate-400 uppercase font-semibold block text-[10px]">MRN</span>
                        <span className="font-mono font-bold text-slate-800 dark:text-slate-200">{chartData.patient.mrn}</span>
                      </div>
                      <div>
                        <span className="text-slate-400 uppercase font-semibold block text-[10px]">Age / Gender</span>
                        <span className="font-semibold text-slate-800 dark:text-slate-200">{chartData.patient.age} yrs | {chartData.patient.gender}</span>
                      </div>
                      <div>
                        <span className="text-slate-400 uppercase font-semibold block text-[10px]">Care Setting</span>
                        <span className="font-semibold text-slate-800 dark:text-slate-200">{chartData.patient.setting}</span>
                      </div>
                    </div>

                    {/* SECTION 1: ASSESSMENT */}
                    <div className="space-y-3">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-sky-600 dark:text-sky-400 border-b border-sky-200 dark:border-sky-800/50 pb-1">
                        1. Nutrition Assessment (AD)
                      </h3>
                      <div className="grid grid-cols-1 gap-2.5 text-xs text-slate-700 dark:text-slate-300">
                        <div><strong className="text-slate-900 dark:text-slate-100">Food/Nutrition History (FH):</strong> {chartData.assessment.FH}</div>
                        <div><strong className="text-slate-900 dark:text-slate-100">Anthropometrics (AD):</strong> {chartData.assessment.AD}</div>
                        <div><strong className="text-slate-900 dark:text-slate-100">Biochemical Data (BD):</strong> {chartData.assessment.BD}</div>
                        <div><strong className="text-slate-900 dark:text-slate-100">Physical Findings (PD):</strong> {chartData.assessment.PD}</div>
                        <div><strong className="text-slate-900 dark:text-slate-100">Client History (CH):</strong> {chartData.assessment.CH}</div>
                      </div>
                    </div>

                    {/* SECTION 2: DIAGNOSIS */}
                    <div className="space-y-3">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-amber-600 dark:text-amber-400 border-b border-amber-200 dark:border-amber-800/50 pb-1">
                        2. Nutrition Diagnosis (ND - PES Statement)
                      </h3>
                      <div className="p-4 bg-amber-50/80 dark:bg-amber-950/30 border-l-4 border-amber-500 rounded-r-xl text-xs font-medium text-amber-950 dark:text-amber-200 leading-relaxed font-mono">
                        {pesValidation.formattedPES}
                      </div>
                    </div>

                    {/* SECTION 3: INTERVENTION */}
                    <div className="space-y-3">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-emerald-600 dark:text-emerald-400 border-b border-emerald-200 dark:border-emerald-800/50 pb-1">
                        3. Nutrition Intervention (NI)
                      </h3>
                      <div className="grid grid-cols-1 gap-2 text-xs text-slate-700 dark:text-slate-300">
                        <div><strong className="text-slate-900 dark:text-slate-100">Standardized Domain & Code:</strong> <span className="font-mono font-semibold bg-emerald-100 dark:bg-emerald-950 px-1.5 py-0.5 rounded text-emerald-800 dark:text-emerald-300">{chartData.intervention.domain} - {chartData.intervention.code}</span></div>
                        <div><strong className="text-slate-900 dark:text-slate-100">Action Plan Details:</strong> {chartData.intervention.details}</div>
                        <div><strong className="text-slate-900 dark:text-slate-100">Target Outcome Goal:</strong> {chartData.intervention.targetGoal}</div>
                      </div>
                    </div>

                    {/* SECTION 4: MONITORING & EVALUATION */}
                    <div className="space-y-3">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-purple-600 dark:text-purple-400 border-b border-purple-200 dark:border-purple-800/50 pb-1">
                        4. Nutrition Monitoring & Evaluation (ME)
                      </h3>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs text-slate-700 dark:text-slate-300">
                        <div><strong className="text-slate-900 dark:text-slate-100">Indicator:</strong> {chartData.monitoring.indicator}</div>
                        <div><strong className="text-slate-900 dark:text-slate-100">Target Criteria:</strong> {chartData.monitoring.targetCriteria}</div>
                        <div><strong className="text-slate-900 dark:text-slate-100">Target Re-evaluation Date:</strong> <span className="font-mono">{chartData.monitoring.targetDate}</span></div>
                        <div><strong className="text-slate-900 dark:text-slate-100">Progress Status:</strong> <span className="font-semibold text-purple-700 dark:text-purple-300">{chartData.monitoring.status}</span></div>
                        <div className="sm:col-span-2"><strong className="text-slate-900 dark:text-slate-100">Follow-up Plan:</strong> {chartData.monitoring.followUpNotes}</div>
                      </div>
                    </div>

                    {/* CLINICIAN SIGNATURE BLOCK */}
                    <div className="pt-6 border-t border-slate-200 dark:border-slate-700 flex justify-between items-end text-xs text-slate-500">
                      <div>
                        <div>Signed Electronically by:</div>
                        <div className="font-bold text-slate-800 dark:text-slate-200 mt-1">Nutrition Informatics Student / Clinical Dietitian</div>
                      </div>
                      <div className="text-right font-mono text-[10px]">
                        Lab 3 Artifact | eNCPT Compliant
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* ======================================================== */}
            {/* TAB 5: LAB GUIDE & CHECKLIST                             */}
            {/* ======================================================== */}
            {activeTab === "labGuide" && (
              <div className="space-y-6">
                <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-6">
                  
                  {/* LAB OVERVIEW HEADER */}
                  <div className="flex flex-wrap items-center justify-between gap-4 pb-4 border-b border-slate-100 dark:border-slate-700">
                    <div>
                      <h2 className="text-base font-bold text-slate-900 dark:text-white flex items-center gap-2">
                        <Icon name="checklist" className="w-5 h-5 text-brand-600 dark:text-brand-400" />
                        110-Minute Interactive Lab Guide & Submissions Checklist
                      </h2>
                      <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                        Follow these steps sequentially to complete Lab 3 on Standardized Clinical Charting.
                      </p>
                    </div>

                    <div className="flex items-center gap-3 bg-slate-50 dark:bg-slate-900 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700">
                      <div className="text-right">
                        <div className="text-[10px] font-bold uppercase tracking-widest text-slate-400">Lab Completion</div>
                        <div className="text-sm font-extrabold text-brand-600 dark:text-brand-400 font-mono">
                          {Math.round((labChecklist.filter(i => i.done).length / labChecklist.length) * 100)}%
                        </div>
                      </div>
                      <div className="w-12 h-12 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center p-1">
                        <div
                          className="w-full h-full rounded-full bg-brand-600 flex items-center justify-center text-white font-bold text-xs"
                          style={{
                            clipPath: `inset(${100 - (labChecklist.filter(i => i.done).length / labChecklist.length) * 100}% 0 0 0)`
                          }}
                        >
                          ✓
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* CHECKLIST ITEMS */}
                  <div className="space-y-3">
                    {labChecklist.map((item) => (
                      <div
                        key={item.id}
                        onClick={() => {
                          setLabChecklist(
                            labChecklist.map(i => i.id === item.id ? { ...i, done: !i.done } : i)
                          );
                        }}
                        className={`p-4 rounded-xl border transition-all cursor-pointer flex items-center justify-between gap-4 ${
                          item.done
                            ? "bg-emerald-50/60 dark:bg-emerald-950/30 border-emerald-200 dark:border-emerald-800/50 text-slate-800 dark:text-slate-200"
                            : "bg-slate-50 dark:bg-slate-900/60 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:border-slate-300"
                        }`}
                      >
                        <div className="flex items-center gap-3">
                          <div className={`w-5 h-5 rounded-md flex items-center justify-center border transition ${
                            item.done
                              ? "bg-emerald-600 border-emerald-600 text-white"
                              : "border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800"
                          }`}>
                            {item.done && <Icon name="check" className="w-3.5 h-3.5" />}
                          </div>
                          <span className={`text-sm font-semibold ${item.done ? "line-through opacity-75" : ""}`}>
                            {item.text}
                          </span>
                        </div>

                        <span className="text-xs font-mono font-medium bg-slate-200 dark:bg-slate-800 px-2.5 py-1 rounded-md text-slate-600 dark:text-slate-400 whitespace-nowrap">
                          {item.time}
                        </span>
                      </div>
                    ))}
                  </div>

                  {/* LAB INSTRUCTIONS & OBJECTIVES */}
                  <div className="p-5 bg-brand-50/60 dark:bg-brand-950/30 border border-brand-200 dark:border-brand-800/50 rounded-xl space-y-3">
                    <h3 className="text-xs font-bold uppercase tracking-wider text-brand-800 dark:text-brand-300">
                      Key Learning Objectives for Lab 3:
                    </h3>
                    <ul className="text-xs text-brand-900 dark:text-brand-200 space-y-1.5 list-disc pl-5 leading-relaxed">
                      <li>Understand structured standardized vocabulary in clinical health informatics (eNCPT terminology tree).</li>
                      <li>Demonstrate guided construction and syntax validation of Nutrition PES Statements.</li>
                      <li>Learn live JSON data serialization and schema compliance checking for interoperability between Web UI and Health Systems.</li>
                      <li>Practice executing RESTful API calls for clinical data ingestion and exporting Postman collections for grading.</li>
                    </ul>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* FOOTER */}
          <footer className="no-print border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 py-4 mt-8">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-xs text-slate-500 dark:text-slate-400 flex flex-wrap justify-between items-center gap-2">
              <div>Lab 3: Standardized Clinical Charting (eNCPT) &bull; Clinical Informatics Sandbox</div>
              <div className="font-mono text-[10px]">JSON Schema v7 &bull; Postman v2.1 &bull; ADIME Compliant</div>
            </div>
          </footer>
        </div>
      );
    }

    // Render the React App
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
